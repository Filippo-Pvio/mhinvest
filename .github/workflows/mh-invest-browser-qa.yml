name: MH-Invest browser QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "leads/mh-invest/**"
      - ".github/workflows/mh-invest-browser-qa.yml"

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: leads/mh-invest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Astro project
        run: npm run build

      - name: Start Astro preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/mh-invest-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mh-invest-preview.log
          exit 1

      - name: Run real-browser viewport QA
        run: npm run qa:browser

      - name: Upload browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mh-invest-browser-qa
          path: |
            leads/mh-invest/screenshots/browser-*-v2.png
            leads/mh-invest/screenshots/qa-results.json
          if-no-files-found: warn
          retention-days: 14
