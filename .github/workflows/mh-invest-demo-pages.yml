name: MH-Invest customer demo

on:
  workflow_dispatch:
  push:
    branches: [lead/mh-invest-hero]
    paths:
      - "leads/mh-invest/**"
      - ".github/workflows/mh-invest-demo-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mh-invest-customer-demo
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leads/mh-invest

    steps:
      - name: Check out lead branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build noindex demo
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload noindex customer demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: leads/mh-invest/dist

      - name: Deploy customer demo
        id: deployment
        uses: actions/deploy-pages@v4
