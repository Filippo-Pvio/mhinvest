name: MH-Invest customer demo

on:
  workflow_dispatch:
  push:
    branches: [lead/mh-invest-hero]
    paths:
      - "leads/mh-invest/customer-demo/**"
      - ".github/workflows/mh-invest-demo-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mh-invest-customer-demo
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out lead branch
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload noindex customer demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: leads/mh-invest/customer-demo

      - name: Deploy customer demo
        id: deployment
        uses: actions/deploy-pages@v4
