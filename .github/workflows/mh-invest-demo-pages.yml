name: MH-Invest private demo artifact

on:
  workflow_dispatch:
  push:
    branches: [lead/mh-invest-hero]
    paths:
      - "leads/mh-invest/**"
      - ".github/workflows/mh-invest-demo-pages.yml"

permissions:
  contents: read

concurrency:
  group: mh-invest-private-demo
  cancel-in-progress: true

jobs:
  build-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leads/mh-invest

    steps:
      - name: Check out lead branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build noindex demo
        run: npm run build

      - name: Upload private demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: mh-invest-private-demo
          path: leads/mh-invest/dist
          if-no-files-found: error
          retention-days: 14
